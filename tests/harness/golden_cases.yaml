#   기대값과 근거는 기능 구현 전에 사람이 판단해 확정했다. 에이전트는 문서 근거와 예시를 제시하고 입력과 형식을 옮겼다.
#   parser_outputs는 호출 순서대로 돌려줄 모의 파서 출력이다. 일부는 파서 실수를 일부러 재현한 값이며 note에 적었다.
#   form_cases의 action: open은 폼을 초안으로 둔 채 배포를 요청하는 것이고, change는 그 요청에 함께 보내는 최상위 키다.
#   expect_unchanged는 요청 뒤 값이 그대로여야 하는 폼 필드 이름이다.
analysis_cases:
  - name: missing_match_two_conditions
    ac: [AC26]
    type: 경계
    input:
