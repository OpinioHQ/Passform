spring.application.name=passform

# 저장소 루트의 .env를 읽는다. 없으면 OS 환경 변수만 쓴다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:passform}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 Flyway만 바꾼다. 엔티티와 어긋나면 앱이 뜨지 않는다.
spring.jpa.hibernate.ddl-auto=validate
# LLM을 부르는 동안 DB 연결을 잡고 있지 않는다.
spring.jpa.open-in-view=false
# 저장은 UTC (AGENTS.md 5절).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API는 SPEC 5절대로 snake_case다.
spring.jackson.property-naming-strategy=SNAKE_CASE

# LLM 키가 없어도 앱·빌드·테스트가 동작하도록 빈 값을 허용한다.
openai.api-key=${OPENAI_API_KEY:}
