    expect_total_submitted_count: 14
    must_not_include: [rb15, rb16]
    note: 결과와 coverage는 submitted 응답만 다룬다. in_progress(rb15)·abandoned(rb16)는 일치에도 전체 수에도 넣지 않는다.

  - name: no_condition_match_any_counts_all
    ac: [AC78, AC24]
    type: 경계
    input:
      fixture: data/seed/forms/form_a_versions.json
      context: {conditions: [], match: any}
      matching: []
    expect_count: 9
    expect_response_ids: [ra01, ra02, ra03, ra04, ra05, ra06, ra07, ra08, ra09]
    expect_not_evaluable_count: 0
    expect_not_evaluable_by_version: []
    note: >-
      SPEC 5절 "조건이 없으면 모든 제출 응답이 일치한다". match가 any여도 전체가 일치한다.
      논리식대로 "조건 중 하나라도 참"을 계산하면 0건이 나오므로, SPEC 규칙이 논리식보다 우선함을 검사한다.

