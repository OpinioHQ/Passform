      - {form_version: 1, question_id: q2, question_note: 학년, options: [1학년, 2학년, 3학년, 4학년]}
      - {form_version: 2, question_id: q1, question_note: 학과, options: [소프트웨어학과, 컴퓨터공학과, 전자공학과]}
      - {form_version: 2, question_id: q2, question_note: 학년, options: [1학년, 2학년, 3학년, 4학년]}
      - {form_version: 3, question_id: q2, question_note: 학년, options: [1학년, 2학년, 3학년, 4학년]}
    expect_parser_calls: 1
    note: >-
      폼에 없는 선택지는 응답자가 고를 수 없었으므로 0건으로 답하지 않고 되묻는다(AC22). 목록은 표 6행대로 버전별 선택형 문항 전체다.
      관련 문항만 고르면 코드가 관련성을 판단해야 하고, 관련 문항이 없는 조건에서 목록이 비므로 전체를 보여 준다(사람 판단). 순서는 버전 오름차순, 버전 안에서 문항 순서다.

