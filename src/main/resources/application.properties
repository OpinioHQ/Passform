spring.application.name=passform

# 저장소 루트의 .env를 읽는다. 없으면 OS 환경 변수만 쓴다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:passform}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 Flyway만 바꾼다. 엔티티와 어긋나면 앱이 뜨지 않는다.
spring.jpa.hibernate.ddl-auto=validate
# LLM을 부르는 동안 DB 연결을 잡고 있지 않는다.
spring.jpa.open-in-view=false
# 저장은 UTC (AGENTS.md 5절).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API는 SPEC 5절대로 snake_case다.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Google 로그인. 값은 .env나 OS 환경변수로만 받는다. 없어도 앱은 뜨고 로그인만 실패한다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# 세션 쿠키. 로컬 HTTP 개발에서만 SESSION_COOKIE_SECURE=false로 끈다. CSRF 토큰 쿠키도 같은 값을 쓴다.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# CORS로 허용하는 프런트 출처 하나. 로그인 뒤에도 이 주소로 보낸다.
passform.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
# 화면과 API의 호스트가 다르면 공통 상위 도메인을 넣는다(예: example.com). 앞에 점을 붙이면 Tomcat이 거부한다. 로컬에서는 비워 둔다.
passform.csrf-cookie-domain=${CSRF_COOKIE_DOMAIN:}

# 업로드는 임시 파일로 받고 한도는 서비스가 판정한다(문항별 25MB, 계정 500MB). 500MB를 넘는 요청은 어차피 저장될 수 없다.
spring.servlet.multipart.max-file-size=501MB
spring.servlet.multipart.max-request-size=501MB
# 한도를 넘은 요청에도 연결을 끊지 않고 오류 본문을 돌려준다.
server.tomcat.max-swallow-size=-1
# 문항마다 파일을 붙이는 제출과 긴 한글 파일 이름이 Tomcat 기본 제한에 걸리지 않게 한다.
server.tomcat.max-part-count=1000
server.tomcat.max-part-header-size=8KB

# S3 버킷. 비어 있으면 앱은 뜨고 파일 기능만 503이다. 자격 증명은 OS 환경변수나 서버 역할로만 받는다.
passform.s3.bucket=${S3_BUCKET:}
passform.s3.region=${S3_REGION:ap-northeast-2}

# LLM 키가 없어도 앱·빌드·테스트가 동작하도록 빈 값을 허용한다.
openai.api-key=${OPENAI_API_KEY:}

# 마감 알림(AC18). 주기는 ISO-8601 기간이다(로컬 확인 때 DEADLINE_REMINDER_INTERVAL=PT1M).
passform.deadline-reminder.hours=${DEADLINE_REMINDER_HOURS:24}
passform.deadline-reminder.interval=${DEADLINE_REMINDER_INTERVAL:PT10M}
passform.deadline-reminder.initial-delay=${DEADLINE_REMINDER_INITIAL_DELAY:PT1M}

# 마감 알림 메일(Gmail SMTP, STARTTLS, 앱 비밀번호). MAIL_USERNAME이나 MAIL_PASSWORD가 비어 있으면 메일 없이 사이트 알림만 만든다.
# 값은 .env와 서버 deploy/.env에만 둔다. spring.mail.*을 쓰지 않아 값이 없을 때 메일 클라이언트를 만들지 않는다.
passform.mail.host=${MAIL_HOST:smtp.gmail.com}
passform.mail.port=${MAIL_PORT:587}
passform.mail.username=${MAIL_USERNAME:}
passform.mail.password=${MAIL_PASSWORD:}
passform.mail.from=${MAIL_FROM:}
