# ---------------------------------------------------------------- 필수 골든 (T2 #50, T3 #51, T7 #55)
#   fixture에 폼 status가 없으므로 시험 시작 때 open이고, 최신 버전은 form_versions의 가장 큰 번호로 본다.
#   expect_question_ids는 오류 응답의 문항 ID, expect_saved_answers는 저장된 답, expect_response_count는 요청 뒤 그 폼의 제출 응답 수다.
#   labels, scores는 {response_id, question_id, label 또는 score} 목록이고 fixture의 모든 장문 답에 값을 준다.
access_cases:
  - name: unauthenticated_401
    ac: [AC2]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_required_branch.json
      actor: anonymous
      method: GET
      path: /me/forms
    expect_status: 401
    note: 사람이 401로 답했다. 로그인이 필요한 API를 로그인 없이 부른 경우다(SPEC 5절 90행, AC2).

  - name: other_users_response_404
    ac: [AC2]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_b_mixed.json
      actor: other_user
      method: GET
      path: /me/responses/rb01
    expect_status: 404
    must_not_contain: [백엔드 개발을 좋아합니다.]
    note: >-
      남의 응답은 있는지도 알리지 않고 내용도 돌려주지 않는다(AC2, SPEC 5절 인증 구분). 유출 검사는 거절 응답 본문에 rb01의 자기소개 원문이 있는지 본다.

  - name: non_owner_analyze_403
    ac: [AC2]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_b_mixed.json
      actor: other_user
      method: POST
      path: /forms/form_b/analyze
      body: {context: {conditions: [], operation: list}}
    expect_status: 403
    must_not_contain: [rb01, 백엔드 개발을 좋아합니다.]
    note: >-
      주소의 폼 ID를 남의 것으로 바꿔 분석을 요청해도 아무 정보도 주지 않는다(사람 판단, AC2). context로 보내 파서를 거치지 않고 권한 판정만 본다.
      유출 검사는 거절 응답 본문에 응답 ID와 원문이 있는지 본다.

