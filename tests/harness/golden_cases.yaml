        - {question_id: q3, value: 신청}
        - {question_id: q4, value: 학생회}
      consent_agreed: true
    expect_error: form_closed
    expect_response_count: 3
    note: 사람 답. 마감 이후 제출은 409 form_closed다. 마감 기한이 지났으니 저장하지 않아 rr01, rr02, rr03만 남는다.

  - name: stale_form_version_rejected
    ac: [AC76]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_required_branch.json
      now: "2026-11-01T00:00:00Z"
