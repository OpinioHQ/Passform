# 시험 데모 전용: ./gradlew bootRun --args='--spring.profiles.active=demo'
# 노트북에서만 연다. 인증 없는 데모 API를 외부에 공개하지 않는다.
server.address=127.0.0.1

# 스키마 이관 도구가 아직 없어 엔티티에서 테이블을 만든다.
spring.jpa.hibernate.ddl-auto=update

# LLM을 부르는 동안 DB 연결을 잡고 있지 않는다.
spring.jpa.open-in-view=false

# API는 SPEC 5절대로 snake_case다.
spring.jackson.property-naming-strategy=SNAKE_CASE

passform.share-base-url=http://localhost:5173
