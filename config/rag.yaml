# config/rag.yaml 초안. 강의 6에서 사람이 쓰는 파일이다. 값마다 근거를 두 분 판단으로 확인하고, 사람이 정해진 위치에 넣는다.
# 값은 SPEC 5절 332행과 시험 데모(2026-11-04)에서 왔다. min_score는 2건만 보고 정한 임시값이다.

source:
  documents: responses          # 대상: AI 요약에 동의한 일치 응답의 주관식 답(SPEC 5절 332행)
  fields: [answer_text]
  metadata: [response_id, form_version, question_id]  # 근거 표시용. 이름·연락처 같은 값은 넣지 않는다

chunking:
  strategy: per_answer          # 답 1개 = 1청크. 폼 답은 짧고 근거를 응답 단위로 보여 줘야 한다
  max_chars: 200                # 근거 발췌 길이(시험 데모). 넘으면 잘라 보여 준다. 임베딩 입력을 자르는 값은 아니다

embedding:
  provider: openai              # AGENTS 7절
  model: text-embedding-3-small
  dim: 1536

store:
  backend: in_memory            # 저장하지 않는다. 요청마다 그 요청의 일치·동의 응답만 임베딩해 비교한다.
                                # 이유: 대상이 조건에 따라 매번 달라지고, 응답 원문의 임베딩을 남기지 않는다. 응답이 늘면 재검토
  metric: cosine

retrieval:
  theme:                        # 주제 근거(유형 A·B·C). 그 주제의 응답 안에서만 찾는다
    top_k: 3
    min_score: 0.2              # 임시. "기타"는 라벨과 답이 비슷하지 않아 항상 근거가 없었다
  topic:                        # 특정 의견(유형 D). 일치·동의 응답 안에서 찾는다
    top_k: 3
    min_score: 0.35             # 임시. "비용이 부담된다"는 통과, "우주여행"은 근거 부족이 되는 것만 확인했다
  rerank: false                 # MVP는 끔. 강의 7 측정 뒤 판단
  hybrid: false                 # MVP는 끔

summary:
  classify_batch_size: 50       # SPEC 5절 332행 임시값
  max_responses_per_request: 300  # 넘으면 LLM을 부르지 않고 too_many_responses(AC93)
  max_themes: 6                 # 임시. 넘은 라벨이 기타로 합쳐져 30건 중 11건이 기타가 됐다. 측정 뒤 조정

constraints:                    # 검색이 아니라 코드로 강제한다
  consented_responses_only: true    # AI 요약 미동의 응답은 분류·임베딩·요약에서 뺀다(AC91)
  matched_responses_only: true      # 코드가 정한 일치 응답 안에서만 찾는다(AC88)
  exclude_personal_questions: true  # 개인정보 문항 값은 보내지 않는다(AC92)
  mask_contacts: true               # 답 속 전화번호·이메일을 가린다(AC92)
  counts_from_labels_only: true     # 주제별 개수는 코드가 라벨로 센다. 검색 결과로 세지 않는다(AC87)
  topic_returns_no_count: true      # 특정 의견 요약은 개수를 돌려주지 않는다(AC89)
  no_answer_as_instruction: true    # 응답 원문은 구분자 안의 데이터다(AC31)

observability:
  log_tool_calls: true          # 용도, 모델, 소요 시간, 토큰
  log_retrieved_chunks: false   # 응답 원문을 로그에 남기지 않는다. 필요하면 response_id만 남긴다
