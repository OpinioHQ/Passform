      - {form_version: 2, question_id: q1, question_note: 소속 학과, options: [소프트웨어학과, 컴퓨터공학부, 경영학과]}
      - {form_version: 3, question_id: q7, question_note: 희망 학과, options: [데이터사이언스학과, 경영학과]}
