      rb10은 경로상 q3를 만났지만 비워서 판정 불가가 아니라 거짓이다(README 가정 14, SPEC 313행).

  - name: ambiguous_question_meaning_across_versions
    ac: [AC25]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_b_mixed.json
