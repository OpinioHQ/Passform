      matching:
        - {condition: 소프트웨어학과, form_version: 1, question_id: q1, kind: option, option: 소프트웨어학과}
        - {condition: 소프트웨어학과, form_version: 2, question_id: q1, kind: option, option: 소프트웨어학과}
        - {condition: 3학년, form_version: 1, question_id: q2, kind: option, option: 3학년}
        - {condition: 3학년, form_version: 2, question_id: q2, kind: option, option: 3학년}
        - {condition: 3학년, form_version: 3, question_id: q2, kind: option, option: 3학년}
    expect_reason: missing_match
    expect_options: [all, any]
    expect_parser_calls: 1
    note: >-
      "소프트웨어학과 3학년"은 둘 다 만족하는 한 묶음으로 읽히지만, "소프트웨어학과랑 3학년"은 각각일 가능성도 있어 불확실하므로 한 번 더 묻는다(사람 판단).
      파서가 실제로 match를 생략하는지는 모델 품질이라 evals에서 잰다. AC26의 혼합 부정 입력("소프트웨어학과가 아닌 4학년 수", options [])은 이 케이스로 검사하지 않는다.

  - name: unsupported_statistics_not_mapped_to_summary
    ac: [AC27, AC77]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_summary.json
      query: 학과별 통계 정리해줘
      parser_outputs:
        - {conditions: [], operation: summarize}
      matching: []
    expect_reason: missing_operation
    expect_options: [count, list, summarize]
    expect_parser_calls: 1
    note: >-
      "보여줘"에서 summarize가 나오는 것은 프롬프트 규칙과 맞지 않아(사람 지적) 프롬프트상 summarize로 가는 "정리해줘"로 입력을 바꿨다.
      파서가 summarize를 내도 원문의 통계 요청을 보고 실행하지 않는다. AI 요약이 켜진 폼이라 세 동작을 안내한다(AC77, 표 3행).
      대시보드 안내는 메시지 문구라 판정 키로 검사하지 않는다.

  - name: missing_operation
