# DB 테스트 전용. 개발 데이터(public)를 건드리지 않도록 별도 스키마를 쓰고, 시작할 때 비워 빈 DB에서 마이그레이션한다.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:passform}?currentSchema=passform_test
spring.datasource.hikari.connection-timeout=3000
spring.flyway.default-schema=passform_test
spring.flyway.schemas=passform_test
spring.flyway.clean-disabled=false
