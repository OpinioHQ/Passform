    expect_options: [count, list, summarize]
    expect_parser_calls: 1
    note: >-
      SPEC 표 3행과 AC27 테스트. operation null은 스키마에 맞는 출력이라 재호출하지 않고(parse_query.md 실패 모드 2번),
      AI 요약이 켜진 폼이므로 세 동작을 안내한다. 사람이 문서 확인 결과를 검토해 확정했다(시험 데모 기록은 대조용으로만 봤다).

  - name: extra_key_retry_once
