      판정 불가 응답이 없는 버전은 not_evaluable_by_version에 넣지 않는다(SPEC 5절, 팀 결정 2026-11-04).

# ---------------------------------------------------------------- 필수 골든 (T2 #50, T3 #51, T7 #55)
#   fixture에 폼 status가 없으므로 시험 시작 때 open이고, 최신 버전은 form_versions의 가장 큰 번호로 본다.
#   expect_question_ids는 오류 응답의 문항 ID, expect_saved_answers는 저장된 답, expect_response_count는 요청 뒤 그 폼의 제출 응답 수다.
#   labels, scores는 {response_id, question_id, label 또는 score} 목록이고 fixture의 모든 장문 답에 값을 준다.
access_cases:
  - name: unauthenticated_401
    ac: [AC2]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_required_branch.json
      actor: anonymous
      method: GET
      path: /me/forms
    expect_status: 401
    note: 사람이 401로 답했다. 로그인이 필요한 API를 로그인 없이 부른 경우다(SPEC 5절 90행, AC2).

submission_cases:
  - name: submit_without_consent
    ac: [AC14]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_required_branch.json
      now: "2026-11-01T00:00:00Z"
      form_version: 2
      answers:
        - {question_id: q1, value: 예}
        - {question_id: q2, value: "2026-11-20"}
        - {question_id: q3, value: 신청}
        - {question_id: q4, value: 학생회}
      consent_agreed: false
    expect_error: consent_required
    expect_response_count: 3
    note: 사람 답. 동의 없는 제출은 거부되어 응답이 늘지 않고 기존 rr01, rr02, rr03만 남는다.

  - name: skipped_answers_dropped
    ac: [AC9]
    type: 경계
    input:
      fixture: data/seed/forms/form_required_branch.json
      now: "2026-11-01T00:00:00Z"
      form_version: 2
      answers:
        - {question_id: q1, value: 아니요}
        - {question_id: q2, value: "2026-11-20"}
        - {question_id: q4, value: 동아리}
      consent_agreed: true
    expect_saved_answers:
      - {question_id: q1, value: 아니요}
      - {question_id: q4, value: 동아리}
    expect_response_count: 4
    note: 사람 답. 제출은 성공한다. q2는 q1 "아니요"로 건너뛰는 문항이라 일단 받더라도 검토 과정에서 저장에서 제외한다. rr01, rr02, rr03에 새 응답 1건이 더해진다.

  - name: required_missing_visited_only
    ac: [AC43, AC9]
    type: 경계
    input:
      fixture: data/seed/forms/form_required_branch.json
      now: "2026-11-01T00:00:00Z"
      form_version: 2
      answers:
        - {question_id: q1, value: 아니요}
      consent_agreed: true
    expect_error: required_missing
    expect_question_ids: [q4]
    expect_response_count: 3
    note: 사람 답. 경로 위의 필수 문항이 비어 있으면 400이고 해당 문항은 q4다. 4xx를 반환하므로 저장하지 않아 rr01, rr02, rr03만 남는다.

  - name: submit_after_deadline
    ac: [AC16]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_required_branch.json
      now: "2026-11-30T15:00:00Z"
