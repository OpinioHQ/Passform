spring.application.name=passform

# 저장소 루트의 .env를 읽는다. 없으면 OS 환경 변수만 쓴다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:passform}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# LLM 키가 없어도 앱·빌드·테스트가 동작하도록 빈 값을 허용한다.
openai.api-key=${OPENAI_API_KEY:}
