      - {form_version: 2, response_count: 1, unavailable_conditions: [팀장]}
      - {form_version: 3, response_count: 1, unavailable_conditions: [팀장]}
    must_not_include: [rb05, rb08, rb13]
    note: >-
      rb09는 q6을 보고도 비웠으므로 팀장이 아닌 것으로 본다(사람 판단, README 가정 14, SPEC 313행). 건너뛴 rb05·rb08·rb13은 판정 불가라 넣지 않는다.
      비운 응답을 "아닌" 쪽으로 셌다는 안내는 판정 키가 없어 이 케이스로 검사하지 않고 팀 논의로 남겼다(사람 제안).

form_cases:
  - name: every_open_form_needs_consent_template
    ac: [AC12]
    type: 금지 행동
    input:
      fixture: data/seed/forms/form_a_versions.json
      actor: owner
      change: {consent_template_id: null}
      action: open
    expect_error: consent_template_required
    expect_unchanged: [status, definition_version, consent_template_id]
    note: >-
      동의 템플릿이 비어서 온 배포 요청은 거절하고 폼을 바꾸지 않는다(AC12, 절대 규칙 1번). action: open은 폼을 초안으로 둔 채 배포를 요청하는 것이고,
      change는 그 요청에 함께 보내는 최상위 키다. 빌더가 기본 템플릿을 미리 선택해도(사람 결정, 별도 SPEC PR) 서버의 안전장치로 남는다.
      이슈 #40에 따라 form_a로 쓰며, 이름·전화번호 형식 폼은 이 케이스로 검사하지 않는다.
      이 케이스는 위 주석의 예외다. form_a의 최신 정의를 응답 없는 초안으로 만들어 시작한다.
